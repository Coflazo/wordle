<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover is what makes env(safe-area-inset-*) return anything
       other than 0 on a notched phone. No user-scalable=no: blocking pinch
       zoom is an accessibility failure. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Oflaz Wordle</title>
  <meta name="description" content="Guess words from 5 to 10 letters in English, Turkish or German, then learn what they mean. Runs entirely on your own machine.">
  <meta name="theme-color" content="#090B12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F6F8FC" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">

  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
  <link rel="apple-touch-icon" href="/assets/icons/favicon.svg">
  <link rel="manifest" href="/assets/manifest.json">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/welcome.css">

  <!-- Fonts load without blocking first paint, and the app stays fully usable
       if they never arrive — which matters for something that promises to run
       offline. The old markup made a render-blocking request to a third-party
       origin before a single pixel could paint. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@600;700;800&display=swap">

  <link rel="modulepreload" href="/js/i18n.js">
  <link rel="modulepreload" href="/js/api.js">
  <link rel="modulepreload" href="/js/state.js">
  <link rel="modulepreload" href="/js/avatar.js">
  <link rel="modulepreload" href="/js/theme.js">
</head>
<body>
  <a class="skip-link" href="#setup" data-i18n="nav.skipToContent">Skip to content</a>

  <canvas id="pixel-bg" aria-hidden="true"></canvas>

  <div class="welcome-shell">
    <main class="welcome-card" id="setup">
      <header class="welcome-header">
        <h1 class="wordmark" data-i18n="app.name">Oflaz Wordle</h1>
        <p class="tagline" data-i18n="app.tagline"></p>
      </header>

      <div class="setup-grid">
        <section class="setup-section">
          <h2 class="label" id="label-language" data-i18n="setup.language">Language</h2>
          <div class="segmented" id="language-picker" role="radiogroup" aria-labelledby="label-language">
            <button data-value="en" lang="en">English</button>
            <button data-value="tr" lang="tr">Türkçe</button>
            <button data-value="de" lang="de">Deutsch</button>
          </div>
        </section>

        <section class="setup-section">
          <h2 class="label" id="label-difficulty" data-i18n="setup.difficulty">Difficulty</h2>
          <div class="segmented" id="difficulty-picker" role="radiogroup" aria-labelledby="label-difficulty">
            <button data-value="chill" data-i18n="difficulty.chill" data-i18n-title="difficulty.chillHint">Chill</button>
            <button data-value="classic" data-i18n="difficulty.classic" data-i18n-title="difficulty.classicHint">Classic</button>
            <button data-value="scholar" data-i18n="difficulty.scholar" data-i18n-title="difficulty.scholarHint">Scholar</button>
          </div>
        </section>

        <section class="setup-section">
          <h2 class="label" id="label-length" data-i18n="setup.wordLength">Word length</h2>
          <div class="segmented length-picker" id="length-picker" role="radiogroup" aria-labelledby="label-length">
            <button data-value="mix" data-i18n="setup.mix" data-i18n-title="setup.mixHint">Mix</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button data-value="10">10</button>
          </div>
        </section>

        <section class="setup-section">
          <h2 class="label" id="label-theme" data-i18n="setup.theme">Theme</h2>
          <div class="segmented" id="theme-picker" role="radiogroup" aria-labelledby="label-theme">
            <button data-value="system" data-i18n="theme.system">System</button>
            <button data-value="dark" data-i18n="theme.dark">Dark</button>
            <button data-value="light" data-i18n="theme.light">Light</button>
            <button data-value="contrast" data-i18n="theme.contrast">Contrast</button>
            <button data-value="colorblind" data-i18n="theme.colorblind">Colourblind</button>
          </div>
        </section>

        <section class="setup-section">
          <h2 class="label" id="label-character" data-i18n="setup.character">Character</h2>
          <div class="character-row" id="character-row" role="radiogroup" aria-labelledby="label-character">
            <div class="character-tile" data-value="default" tabindex="0">
              <span class="avatar-slot" id="avatar-default"></span>
              <span>
                <span class="name" data-i18n="setup.defaultName">Oflaz</span>
                <span class="desc" data-i18n="setup.defaultDesc"></span>
              </span>
            </div>
            <div class="character-tile" data-value="custom" tabindex="-1">
              <span class="avatar-slot" id="avatar-preview-small"></span>
              <span>
                <span class="name" data-i18n="setup.customName">Make your own</span>
                <span class="desc" data-i18n="setup.customDesc"></span>
              </span>
            </div>
          </div>

          <details class="advanced-options" id="custom-editor">
            <summary data-i18n="setup.customize">Customize your character</summary>
            <div class="editor-grid">
              <div class="field">
                <label class="label" for="custom-name" data-i18n="setup.name">Name</label>
                <input class="input" id="custom-name" type="text" maxlength="24"
                       data-i18n-placeholder="setup.namePlaceholder" autocomplete="nickname">
              </div>
              <div class="field">
                <label class="label" for="custom-hair" data-i18n="setup.hair">Hair</label>
                <select class="select" id="custom-hair"></select>
              </div>
              <div class="field">
                <label class="label" for="custom-accessory" data-i18n="setup.accessory">Accessory</label>
                <select class="select" id="custom-accessory"></select>
              </div>
              <div class="field">
                <span class="label" id="label-shirt" data-i18n="setup.shirt">Shirt colour</span>
                <div class="swatch-row" id="shirt-row" role="group" aria-labelledby="label-shirt"></div>
              </div>
              <div class="field">
                <span class="label" id="label-aura" data-i18n="setup.aura">Aura colour</span>
                <div class="swatch-row" id="aura-row" role="group" aria-labelledby="label-aura"></div>
              </div>
              <div class="field">
                <span class="label" data-i18n="setup.preview">Preview</span>
                <div class="avatar-preview" id="avatar-preview"></div>
              </div>
            </div>
          </details>
        </section>
      </div>

      <div class="quick-start">
        <button class="btn btn-primary" id="start-btn" type="button" data-i18n="setup.start">
          Start game
        </button>
        <button class="btn" id="daily-btn" type="button"
                data-i18n="setup.daily" data-i18n-title="setup.dailyHint">
          Today's puzzle
        </button>
      </div>

      <footer class="welcome-footer">
        <p class="hint-text" data-i18n="game.meaningIntro"></p>
        <a class="quiet-link" href="/profile" data-i18n="nav.viewProfile">View profile</a>
      </footer>
    </main>
  </div>

  <script type="module" src="/js/welcome.js"></script>
  <script type="module" src="/js/pixel-background.js"></script>
</body>
</html>
