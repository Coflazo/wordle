<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Oflaz Wordle — Profile</title>
  <meta name="description" content="Your vocabulary progress across English, Turkish and German.">
  <meta name="theme-color" content="#090B12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F6F8FC" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">

  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
  <link rel="apple-touch-icon" href="/assets/icons/favicon.svg">
  <link rel="manifest" href="/assets/manifest.json">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/profile.css">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@600;700;800&display=swap">

  <link rel="modulepreload" href="/js/i18n.js">
  <link rel="modulepreload" href="/js/api.js">
  <link rel="modulepreload" href="/js/state.js">
  <link rel="modulepreload" href="/js/theme.js">
</head>
<body>
  <a class="skip-link" href="#dashboard" data-i18n="nav.skipToContent">Skip to content</a>

  <div class="profile-shell page">
    <header class="profile-header">
      <span class="avatar-slot" id="profile-avatar" aria-hidden="true"></span>
      <div class="profile-identity">
        <h1 class="profile-name" id="profile-name">—</h1>
        <p class="profile-meta" id="profile-meta"></p>
      </div>
      <div class="profile-actions">
        <a class="btn btn-primary" href="/" data-i18n="nav.newGame">New game</a>
      </div>
    </header>

    <div class="tab-strip" id="lang-tabs" aria-label="Language filter">
      <button data-value="all" data-i18n="profile.all">All</button>
      <button data-value="en" lang="en">English</button>
      <button data-value="tr" lang="tr">Türkçe</button>
      <button data-value="de" lang="de">Deutsch</button>
    </div>

    <main id="dashboard">
      <div id="empty-state"></div>

      <section class="section" data-section hidden>
        <h2 class="visually-hidden" data-i18n="profile.title">Profile</h2>
        <div class="stat-grid" id="stat-grid"></div>
      </section>

      <section class="section" data-section hidden>
        <h2 class="section-title" data-i18n="profile.distribution">Guesses needed, by word length</h2>
        <div class="card distribution" id="distribution" style="padding: var(--space-4)"></div>
      </section>

      <section class="section" data-section hidden>
        <h2 class="section-title" data-i18n="profile.languageSplit">By language</h2>
        <div class="card" id="language-split" style="padding: var(--space-4); display: grid; gap: var(--space-3)"></div>
      </section>

      <section class="section" data-section hidden>
        <h2 class="section-title" data-i18n="profile.vocabulary">Vocabulary</h2>
        <div class="tables">
          <div class="word-table">
            <h3 data-i18n="profile.mastered">Mastered</h3>
            <div id="table-mastered"></div>
          </div>
          <div class="word-table">
            <h3 data-i18n="profile.known">Known</h3>
            <div id="table-known"></div>
          </div>
          <div class="word-table">
            <h3 data-i18n="profile.struggling">Still tricky</h3>
            <div id="table-struggling"></div>
          </div>
        </div>
      </section>

      <section class="section" data-section hidden>
        <h2 class="section-title" data-i18n="profile.recentGames">Recent games</h2>
        <div class="card timeline" id="timeline" style="padding: var(--space-3)"></div>
      </section>

      <section class="section">
        <h2 class="section-title" data-i18n="profile.experiments">Experiments</h2>
        <div id="experiments" style="display: grid; gap: var(--space-3)"></div>
      </section>
    </main>
  </div>

  <script type="module" src="/js/profile.js"></script>
</body>
</html>
